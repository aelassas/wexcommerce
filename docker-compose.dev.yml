services:
  mongo:
    image: mongo:7.0.12 # Update mongo version if necessary
    command: mongod --quiet --logpath /dev/null
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    ports:
      - 27018:27017
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username admin --password admin --authenticationDatabase admin --eval \"try { rs.status().ok } catch (error) { db.runCommand({ ping: 1 }).ok }\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  mongo-express:
    image: mongo-express:latest
    restart: always
    ports:
      - 8084:8081
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      mongo:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  wc-dev-backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.dev
    env_file: ./backend/.env.docker.development
    restart: always
    ports:
      - 4005:4005
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - cdn:/var/www/cdn/wexcommerce
      - ./backend:/wexcommerce/backend
      - /wexcommerce/backend/node_modules
      - backend_logs:/wexcommerce/backend/logs

  wc-dev-admin:
    build:
      context: .
      dockerfile: ./admin/Dockerfile.dev
    env_file: ./admin/.env.docker.development
    restart: always
    depends_on:
      - wc-dev-backend
    ports:
      - 8005:8005
    volumes:
      - ./admin:/wexcommerce/admin
      - /wexcommerce/admin/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

  wc-dev-frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.dev
    env_file: ./frontend/.env.docker.development
    restart: always
    depends_on:
      - wc-dev-backend
    ports:
      - 8006:8006
    volumes:
      - ./frontend:/wexcommerce/frontend
      - /wexcommerce/frontend/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

volumes:
  cdn:
  mongodb_data:
  mongodb_config:
  backend_logs:
  redis_data:
